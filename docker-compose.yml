version: '3.9'

services:
  db:
    image: postgres:16
    container_name: contacts-db
    restart: always
    environment:
      POSTGRES_DB: contactsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ailynmedina
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: contacts-backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: contactsdb
      DB_USER: postgres
      DB_PASSWORD: ailynmedina
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ./frontend:/app/public